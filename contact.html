<style>
  .contact-dock{
    position:fixed; left:22px; bottom:64px; z-index:20;   /* clears the floating island pill */
    width:min(330px, calc(100vw - 44px));
    background:var(--paper-2); border:3px solid var(--ink);
    box-shadow:var(--shadow); padding:16px 16px 14px;
  }
  .contact-dock h2{
    font-family:var(--pixel); font-size:10px; letter-spacing:.12em; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .contact-dock h2::before{ content:""; width:10px; height:10px; background:var(--red); display:block; }
  .contact-dock a{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-family:var(--crt); font-size:17px; color:var(--ink); text-decoration:none;
    border-bottom:2px dashed var(--line); padding:9px 2px;
    transition:background .12s, padding-left .12s;
  }
  .contact-dock a:hover, .contact-dock a:focus-visible{
    background:#fff; padding-left:8px; border-bottom-color:var(--red); outline:none;
  }
  .contact-dock a:focus-visible{ box-shadow:inset 0 0 0 3px var(--red); }
  .contact-dock a span{ font-family:var(--pixel); font-size:8px; color:var(--red); letter-spacing:.08em; }
  .contact-dock .row{ display:flex; gap:8px; margin-top:14px; }
  .cv-pick{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-top:12px; padding-top:10px; border-top:2px solid var(--line);
  }
  .cv-pick span{
    font-family:var(--pixel); font-size:7px; letter-spacing:.08em; color:var(--grey);
    width:100%; margin-bottom:2px;
  }
  .contact-dock .cv-pick a{
    font-family:var(--pixel); font-size:7px; letter-spacing:.06em; color:var(--ink);
    border:2px solid var(--ink); padding:6px 8px; text-decoration:none; background:var(--paper-2);
    display:inline-flex; justify-content:center; padding-left:8px;
  }
  .contact-dock .cv-pick a:hover{ background:var(--ink); color:var(--paper-2); padding-left:8px; }
  .contact-dock .row .btn{ flex:1; justify-content:center; text-align:center; }
  @media (max-width:760px){
    .contact-dock{ left:10px; right:10px; bottom:58px; width:auto; padding:10px 12px; max-height:62vh; overflow:auto; }
    .contact-dock a{ font-size:15px; padding:7px 2px; }
    .contact-dock .row{ margin-top:10px; }
    .cv-pick{ margin-top:9px; padding-top:8px; }
  }
</style>
